name: Report a bug
description: Tell me about a problem in Sarevoc´s CCU Planer
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the planner! Your report will be public. Please use sample data and leave out credentials, account names, hangar exports, session files, and tokens.
  - type: input
    id: version
    attributes:
      label: Planner version
      placeholder: 0.3.74 Alpha
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected area
      placeholder: Inventory, CCU planner, export, or installer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      render: text
    validations:
      required: true
